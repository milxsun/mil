<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>iPhone</title>
<style>
:root{--w:402px;--glass:rgba(255,255,255,.16);--edge:rgba(255,255,255,.34)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#08090c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR",Roboto,sans-serif;color:#fff;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;user-select:none}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* 리퀴드 글래스: 투명 + 블러 + 가장자리 빛 */
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);border:1px solid var(--edge);box-shadow:inset 0 1.5px 0 #ffffff80,inset 0 -1px 0 #ffffff14,0 10px 30px #00000030}

#phone{position:relative;width:100%;height:100dvh;max-width:var(--w);overflow:hidden;background:#0d1226;isolation:isolate}
@media(min-width:500px){#phone{height:min(874px,94dvh);border-radius:58px;box-shadow:0 0 0 9px #101116,0 0 0 11px #3a3c45,0 40px 90px #000b}}

.wp{position:absolute;inset:0;z-index:-2;background:
 radial-gradient(85% 38% at 82% 6%,#7fd4ff,transparent 72%),
 radial-gradient(70% 40% at 8% 34%,#3b7bff,transparent 70%),
 radial-gradient(90% 45% at 100% 62%,#8a5cff,transparent 70%),
 radial-gradient(90% 40% at 12% 96%,#ff5fa8,transparent 68%),
 radial-gradient(70% 30% at 85% 100%,#ffa24d,transparent 70%),
 linear-gradient(180deg,#1b2f9a,#3a2a9e 55%,#6a2a9a);background-size:cover;background-position:center}
.dim{position:absolute;inset:0;z-index:-1;background:#00000040;opacity:0;transition:opacity .4s,backdrop-filter .4s;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}
#phone.pass .dim{opacity:1;backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%)}
#phone.home .dim{opacity:.35}

.status{position:absolute;z-index:30;top:0;left:0;right:0;height:56px;padding:calc(env(safe-area-inset-top,0px) + 17px) 34px 0 40px;display:flex;justify-content:space-between;font-size:17px;font-weight:600;pointer-events:none}
.status .r{display:flex;gap:6px;align-items:center}
.island{position:absolute;z-index:31;top:calc(env(safe-area-inset-top,0px) + 11px);left:50%;width:120px;height:35px;margin-left:-60px;border-radius:20px;background:#000}
@media(max-width:499px){.island{width:104px;height:31px;margin-left:-52px}}

.screen{position:absolute;inset:0;transition:transform .55s cubic-bezier(.32,.72,0,1),opacity .4s,filter .4s}

/* 잠금화면 */
.lock{display:flex;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 68px);cursor:pointer;touch-action:none}
.lock .date{font-size:21px;font-weight:600;opacity:.92;letter-spacing:-.3px}
.lock .time{position:relative;display:inline-block;font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;font-size:118px;font-weight:800;line-height:1;letter-spacing:-2px;margin-top:2px;font-variant-numeric:tabular-nums;
 background:linear-gradient(175deg,#ffffff94 0%,#dff1ff52 45%,#ffe2f038 75%,#ffffff6e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.6px #ffffffb8;
 filter:drop-shadow(0 1px 0 #ffffff66) drop-shadow(0 10px 22px #1a1f6045)}
.lock .time::after{content:attr(data-t);position:absolute;left:0;top:0;white-space:nowrap;-webkit-text-stroke:0;color:transparent;background:linear-gradient(110deg,transparent 36%,#ffffffd9 50%,transparent 64%);background-size:260% 100%;background-position:130% 0;-webkit-background-clip:text;background-clip:text;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,55%{background-position:130% 0}100%{background-position:-30% 0}}
@media(prefers-reduced-motion:reduce){.lock .time::after{animation:none}}
.lock .quick{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);left:46px;right:46px;display:flex;justify-content:space-between}
.quick span{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 126px);left:0;right:0;text-align:center;font-size:15px;font-weight:500;opacity:.8;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.bar{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:#fff;opacity:.92}
#phone.pass .lock{transform:scale(.96);opacity:.0;pointer-events:none}
#phone.home .lock{transform:translateY(-12%) scale(.94);opacity:0;filter:blur(14px);pointer-events:none}

/* 암호 화면 */
.pw{display:flex;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 96px);opacity:0;pointer-events:none;transform:translateY(28px) scale(.98)}
#phone.pass .pw{opacity:1;pointer-events:auto;transform:none}
.pw h2{margin:0;font-size:21px;font-weight:600}
.dots{display:flex;gap:22px;margin-top:30px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #ffffffd0;transition:background .12s,transform .12s}
.dots i.on{background:#fff;transform:scale(1.08)}
.dots.shake{animation:shake .45s}
@keyframes shake{15%{transform:translateX(-14px)}35%{transform:translateX(12px)}55%{transform:translateX(-9px)}75%{transform:translateX(5px)}}
.err{height:20px;margin-top:14px;font-size:14px;opacity:.9}
.pad{display:grid;grid-template-columns:repeat(3,80px);gap:16px 24px;margin-top:20px}
.k{width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .12s,transform .12s}
.k:active{background:#ffffff59;transform:scale(.94)}
.k b{font-size:35px;font-weight:400;line-height:1}
.k small{font-size:10px;letter-spacing:2px;margin-top:2px;height:11px;font-weight:700;opacity:.85}
.pw .foot{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);left:0;right:0;display:flex;justify-content:space-between;padding:0 56px;font-size:18px;font-weight:500}
@media(max-height:700px){.pw{padding-top:72px}.pad{gap:10px 22px;grid-template-columns:repeat(3,68px)}.k{width:68px;height:68px}.k b{font-size:30px}.dots{margin-top:18px}}

/* 홈 화면 */
.homes{padding:calc(env(safe-area-inset-top,0px) + 76px) 22px 0;transform:scale(1.1);opacity:0;pointer-events:none;filter:blur(10px)}
#phone.home .homes{transform:none;opacity:1;pointer-events:auto;filter:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:500;text-shadow:0 1px 4px #0005}
#phone.home .app{animation:pop .55s cubic-bezier(.34,1.4,.64,1) both;animation-delay:calc(var(--i)*22ms)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.ic{position:relative;width:64px;height:64px;border-radius:22.5%;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 10px #0000003d;transition:transform .15s,filter .15s}
.ic svg{width:100%;height:100%;display:block}
.app:active .ic{transform:scale(.9);filter:brightness(.82)}
.search{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 132px);left:50%;transform:translateX(-50%);padding:9px 26px;border-radius:22px;font-size:14px;font-weight:500;display:flex;gap:7px;align-items:center}
.dock{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);left:14px;right:14px;height:96px;border-radius:38px;display:flex;justify-content:space-around;align-items:center;padding:0 8px}
.dock .app span:last-child{display:none}
.toast{position:absolute;z-index:40;top:calc(env(safe-area-inset-top,0px) + 56px);left:14px;right:14px;padding:13px 16px;border-radius:26px;font-size:14px;font-weight:500;transform:translateY(calc(-100% - 100px));opacity:0;transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .3s;background:#ffffff38}
.toast.show{transform:none;opacity:1}
.status{transition:color .3s}
#phone.light .status{color:#111}
.appv{z-index:20;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.86);pointer-events:none;border-radius:44px}
.appv.dk{background:#000;color:#fff}
#phone.app .appv{opacity:1;transform:none;pointer-events:auto;border-radius:0}
#phone.app .homes{transform:scale(.94);opacity:.5;filter:blur(8px)}
.appc{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:0 30px}
.appc h3{margin:6px 0 0;font-size:22px}
.appc p{margin:0;opacity:.6;font-size:15px}
.appv .bar{background:currentColor;opacity:.85}
.kk{position:absolute;inset:0;display:none;flex-direction:column;background:#fff;color:#191919;text-align:left}
.kk.on{display:flex}
.kk button{text-align:left}
.kh{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 60px) 18px 6px;flex:none}
.kh h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.5px}
.kic{display:flex;gap:18px}.kic svg{width:26px;height:26px;display:block}
.kchips{display:flex;gap:8px;padding:8px 18px 12px;flex:none;overflow:hidden}
.kchip{height:34px;border:1px solid #e6e6e6;border-radius:17px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap;color:#222}
.kchip svg{width:18px;height:18px}
.kchip.on{background:#191919;color:#fff;border-color:#191919;font-weight:600}
.kchip i{background:#ff5a2b;color:#fff;border-radius:10px;font-style:normal;font-size:11px;font-weight:700;padding:1px 6px}
.kscroll{flex:1;overflow-y:auto;min-height:0;padding-bottom:12px;scrollbar-width:none}
.kscroll::-webkit-scrollbar,.kmsgs::-webkit-scrollbar{display:none}
.kban{margin:2px 18px 8px;background:#f5f5f5;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.kban small{font-size:11px;color:#777}.kban b{display:block;font-size:15px;margin:3px 0 2px}.kban span{font-size:12px;color:#666}.kban em{font-style:normal;font-size:34px}
.kr{display:flex;align-items:center;gap:14px;padding:10px 18px;width:100%}
.kav{position:relative;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.kav svg,.kav img{width:100%;height:100%;object-fit:cover;display:block}
.kav img{position:absolute;inset:0}
.kav.sp{width:40px;height:40px}
.kmid{flex:1;min-width:0}
.kn{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp{font-size:14px;color:#8a8a8a;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:flex-start;padding-top:2px}
.kt{font-size:12px;color:#9a9a9a}
.kbd{min-width:22px;height:22px;border-radius:11px;background:#ff5a2b;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.ksec{font-size:13px;color:#8a8a8a;padding:14px 18px 4px}
.kdiv{height:1px;background:#f0f0f0;margin:6px 18px}
.kst{font-size:13px;color:#8a8a8a;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ktab{display:flex;flex:none;border-top:1px solid #eee;background:#fff;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 26px)}
.ktab button{flex:1;display:flex;justify-content:center;color:#b8b8b8;position:relative;padding:6px 0}
.ktab button.on{color:#1a1a1a}
.ktab svg{width:28px;height:28px;fill:currentColor}
.ktab .kbd{position:absolute;top:-2px;left:calc(50% + 4px);height:18px;min-width:18px;font-size:11px;padding:0 5px}
.ktab .kdot{position:absolute;top:4px;left:calc(50% + 12px);width:7px;height:7px;border-radius:50%;background:#ff5a2b}
.kroom{background:#b2c7da}
.krh{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 56px) 14px 10px 8px;flex:none}
.krh h2{flex:1;margin:0;font-size:17px;font-weight:700}
.krh button{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.krh svg{width:24px;height:24px}
.kmsgs{flex:1;overflow-y:auto;min-height:0;padding:4px 14px 10px;scrollbar-width:none}
.ksep{width:fit-content;margin:14px auto 10px;background:#0000002e;color:#fff;font-size:12px;border-radius:12px;padding:4px 12px}
.kmr{display:flex;gap:8px;margin-top:4px;align-items:flex-start}
.kmr.f{margin-top:14px}
.kmr.me{justify-content:flex-end}
.kcol{min-width:0;max-width:calc(100% - 50px)}
.kname{font-size:13px;color:#333;margin:0 0 5px 2px}
.kline{display:flex;gap:5px;align-items:flex-end}
.kbb{background:#fff;border-radius:14px;padding:9px 12px;font-size:14.5px;line-height:1.45;max-width:230px;white-space:pre-wrap;overflow-wrap:anywhere;color:#191919}
.kmr.me .kbb{background:#fee500}
.kmt{font-size:11px;color:#4b5a68;white-space:nowrap;text-align:right;line-height:1.25}
.kmt b{color:#e8b800;font-weight:700;display:block}
.kinp{display:flex;align-items:center;gap:10px;background:#fff;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 28px);flex:none}
.kinp .pl{width:30px;height:30px;border-radius:50%;border:1.5px solid #bdbdbd;color:#bdbdbd;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}
.kinp .fd{flex:1;min-width:0;height:38px;border:0;outline:0;border-radius:19px;background:#f2f2f2;padding:0 14px;font:inherit;font-size:16px;color:#191919}
.kinp .sd{width:34px;height:34px;border-radius:50%;background:#f0f0f0;color:#bdbdbd;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.kinp .sd.on{background:#fee500;color:#3a1d1d}
.kinp .sd svg{width:18px;height:18px}
.appv .bar{z-index:5}
.ph{position:absolute;inset:0;z-index:1;display:none;background:#fff;color:#111;overflow:hidden;text-align:left}
.ph.on{display:block}
.ph button{text-align:left}
.pscroll{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 124px) 0 130px;scrollbar-width:none}
.pscroll::-webkit-scrollbar{display:none}
.phd{position:absolute;z-index:3;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 58px) 16px 28px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(#fff 60%,#fff0);pointer-events:none}
.phd>*{pointer-events:auto}
.phd h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.phd small{display:block;font-size:15px;font-weight:600;color:#7a7a7f;margin-top:3px}
.pbtns{display:flex;gap:10px}
.pgl{height:44px;min-width:44px;padding:0 16px;border-radius:22px;background:#f2f2f4;box-shadow:0 1px 6px #0002;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#111}
.pgl svg{width:22px;height:22px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pt{position:relative;aspect-ratio:1;overflow:hidden;display:block;width:100%}
.pt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.alb{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;padding:0 16px}
.ac .pt{border-radius:14px}.ac b{display:block;margin-top:7px;font-size:15px}.ac>span:last-child{font-size:14px;color:#888}
.ptab{position:absolute;z-index:4;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.ptab>*{pointer-events:auto}
.ptabs{display:flex;gap:2px;padding:5px;border-radius:34px;background:#fffffff0;box-shadow:0 4px 18px #0003}
.ptabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 20px;border-radius:28px;font-size:11px;font-weight:700;color:#222}
.ptabs button svg{width:28px;height:28px}
.ptabs button.on{background:#ececef;color:#2f7cf6}
.psearch{width:62px;height:62px;border-radius:50%;background:#fffffff0;box-shadow:0 4px 18px #0003;display:flex;align-items:center;justify-content:center}
.psearch svg{width:26px;height:26px}
.pv{position:absolute;inset:0;z-index:3;background:#fff;display:none;flex-direction:column;color:#111;text-align:left}
.pv.on{display:flex}
.pv.dk{background:#000}
.pvt{position:absolute;z-index:2;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 58px) 14px 8px;display:flex;align-items:center;justify-content:space-between;transition:opacity .2s}
.pvt .tt{text-align:center;font-size:15px;font-weight:700;line-height:1.25}.pvt .tt small{display:block;font-size:12px;color:#777;font-weight:500}
.pvimg{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:pan-y;user-select:none}
.pvimg img{max-width:100%;max-height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.ph0{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:#555;text-align:center;padding:20px}
.pvb{display:flex;justify-content:space-around;padding:12px 24px calc(env(safe-area-inset-bottom,0px) + 34px);transition:opacity .2s}
.pvb svg{width:26px;height:26px;stroke:#111;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pv.dk .pvt,.pv.dk .pvb{opacity:0;pointer-events:none}
.pp{position:absolute;inset:0;z-index:1;display:none;background:#f5f5f7;color:#111;overflow:hidden;text-align:left}
.pp.on{display:block}
.pp button{text-align:left}
.tmain{position:absolute;inset:0}
.tscroll{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 118px) 0 140px;scrollbar-width:none}
.tscroll::-webkit-scrollbar{display:none}
.thd{position:absolute;z-index:3;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 56px) 16px 22px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#f5f5f7 62%,#f5f5f700)}
.tgl{height:46px;min-width:46px;padding:0 20px;border-radius:23px;background:#fff;box-shadow:0 1px 8px #0002;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:#111}
.tgl.c{padding:0}.tgl svg{width:22px;height:22px}
.tseg{display:flex;gap:2px;padding:4px;border-radius:26px;background:#fff;box-shadow:0 1px 8px #0002}
.tseg button{height:38px;padding:0 18px;border-radius:19px;font-size:16px;font-weight:600;color:#111}
.tseg button.on{background:#e8e8ed}
.tscroll h1{margin:2px 16px 12px;font-size:38px;font-weight:800;letter-spacing:-1px}
.tsrch{margin:0 16px 8px;height:46px;border-radius:23px;background:#e9e9ee;display:flex;align-items:center;gap:8px;padding:0 14px;color:#8e8e93;font-size:17px}
.tsrch span{flex:1}.tsrch svg{width:20px;height:20px}
.pav{position:relative;flex:none;border-radius:50%;overflow:hidden;background:linear-gradient(#b9bdc9,#8d92a3);display:block}
.pav svg,.pav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.trow{position:relative;display:flex;align-items:center;padding:0 16px}
.trow::after{content:"";position:absolute;left:82px;right:0;bottom:0;height:1px;background:#e5e5ea}
.tmainb{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:11px 0;width:100%}
.tmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tnm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnm.red{color:#ff3b30}
.tsub{font-size:14.5px;color:#8e8e93}
.ttm{font-size:15px;color:#8e8e93;margin-left:6px;white-space:nowrap}
.tinf{width:36px;height:36px;border-radius:50%;border:1.5px solid #2f7cf6;background:#eaf2ff;color:#2f7cf6;font:italic 700 18px Georgia,serif;display:flex;align-items:center;justify-content:center;margin-left:12px;flex:none}
.tsec{padding:14px 16px 4px;font-size:15px;color:#8e8e93;font-weight:600}

.ntsec{font-size:15px;font-weight:700;color:#3c3c43;margin:18px 6px 8px;display:flex;align-items:center;gap:6px}
.ntsec svg{width:14px;height:14px;fill:#8e8e93}
.ntcard{background:#fff;border-radius:20px;overflow:hidden}
.ntfr{display:flex;align-items:center;gap:14px;padding:13px 16px;width:100%;position:relative;font-size:17px}
.ntfr::after{content:"";position:absolute;left:56px;right:0;bottom:0;height:1px;background:#e5e5ea}.ntfr:last-child::after,.ntnr:last-child::after{display:none}
.ntfr b{flex:1;font-weight:500}.ntfr span{color:#8e8e93}
.ntfr .fi{width:26px;height:26px;flex:none}.ntfr .ch{width:13px;height:13px;fill:none;stroke:#c4c4c7;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ntnr{display:block;width:100%;padding:11px 16px 12px;position:relative}
.ntnr::after{content:"";position:absolute;left:16px;right:0;bottom:0;height:1px;background:#e5e5ea}
.ntnr .t{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntnr .s{font-size:15px;color:#8e8e93;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntnr .s b{color:#111;font-weight:400;margin-right:8px}
.ntbot{position:absolute;z-index:4;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ntbar{height:52px;border-radius:26px;background:#fffffff2;box-shadow:0 2px 14px #0002;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;color:#3c3c43;font-size:16px;font-weight:500}
.ntbar svg{width:22px;height:22px;fill:none;stroke:#d9a100;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ntbar.c{flex:1;margin:0 4px;color:#6e6e73;font-size:15px}.ntbar.g{gap:22px;flex:1;justify-content:space-around;padding:0 14px}
.ntcmp{width:52px;height:52px;border-radius:50%;background:#fffffff2;box-shadow:0 2px 14px #0002;display:flex;align-items:center;justify-content:center;flex:none}
.ntcmp svg{width:24px;height:24px;fill:none;stroke:#d9a100;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ntdoc{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 112px) 22px 150px;scrollbar-width:none}
.ntdt{text-align:center;font-size:13px;color:#8e8e93;margin-bottom:14px}
.ntdoc h2{margin:0 0 10px;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.5px;overflow-wrap:anywhere}
.ntln{font-size:18px;line-height:1.5;min-height:1.5em;overflow-wrap:anywhere;white-space:pre-wrap}
.ntck{display:flex;gap:12px;align-items:flex-start;font-size:18px;line-height:1.5;padding:2px 0;width:100%}
.ntck i{flex:none;width:24px;height:24px;margin-top:3px;border-radius:50%;border:1.6px solid #c7c7cc;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:14px;font-weight:700}
.ntck.on i{background:#d9a100;border-color:#d9a100}
.ntck.on span{color:#8e8e93;text-decoration:line-through}
.ig-tile{position:relative;aspect-ratio:4/5;overflow:hidden;background:#e5e5ea;padding:0}
.ig-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ig-sh{position:absolute;inset:0;z-index:5;background:#0006}
.ig-sheet{position:absolute;z-index:6;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 30px)}
.ig-sheet i{display:block;width:40px;height:4px;border-radius:2px;background:#ccc;margin:4px auto 12px}
.ig-sheet p{margin:0;text-align:center;font-weight:700;font-size:15px;padding-bottom:12px;border-bottom:.5px solid #e5e5ea}
.ig-sheet button{display:block;width:100%;padding:15px 22px;font-size:16px}
.ig-sheet .red{color:#ed4956;font-weight:600}
@media(prefers-reduced-motion:reduce){.ig-hp,.iglk.on svg{animation:none}}
.who{position:absolute;inset:0;z-index:28;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 34px;text-align:center;color:#fff;background:#000a;backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%)}
.who.on{display:flex}
.who h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.5px}
.who p{margin:0 0 6px;font-size:15px;line-height:1.5;color:#ddd}
.who input{width:100%;max-width:300px;height:54px;border-radius:27px;border:1px solid #fff5;background:#ffffff26;color:#fff;font:inherit;font-size:20px;text-align:center;outline:0}
.who input::placeholder{color:#fff9}
.who button{width:100%;max-width:300px;height:54px;border-radius:27px;background:#fff;color:#111;font:inherit;font-size:18px;font-weight:700}
@media(prefers-reduced-motion:reduce){.screen,.toast,.dim{transition:none}.hint,.dots.shake,#phone.home .app{animation:none}}

/* 사진 파일 이름이 조금 달라도 자동으로 찾아서 보여줘요: .jpg ↔ .jpeg ↔ .png, 대문자 확장자(.JPG), 이름 전체가 소문자인 경우까지 차례로 시도해요.
   끝까지 못 찾으면 사진 칸을 회색(또는 기본 모양)으로 둬요. */
function imgFix(el,mode){
  if(!el._q){const m=(el.getAttribute('src')||'').match(/^(.*)\.(jpe?g|png|webp|gif|avif)$/i),q=[];
    if(m){const cur=el.getAttribute('src');[m[1],m[1].toLowerCase()].forEach(b=>['jpg','jpeg','JPG','JPEG','png','PNG'].forEach(x=>{const c=b+'.'+x;if(c!==cur&&!q.includes(c))q.push(c)}))}
    el._q=q}
  const n=el._q.shift();
  if(n){el.src=n;return}
  el.onerror=null;
  if(mode===1){el.style.display='none';if(el.nextElementSibling)el.nextElementSibling.style.display='flex'}else el.remove()}

/* 메시지를 대화에 추가 (지금 그 채팅방을 보고 있으면 화면에도 바로 붙임) */
function kPush(c,w,t){const tm=kTime();c.msgs.push([w,t,tm,w==='me'?1:0]);c.p=t;c.t=tm;
  const i=K.chats.indexOf(c),box=$('#kk').querySelector('.kmsgs');

/* 상대가 답장하면 내가 보낸 말의 '1'(안 읽음)이 사라짐 */
function kRead(c){let ch=false;c.msgs.forEach(m=>{if(m[0]==='me'&&m[3]){m[3]=0;ch=true}});
  if(ch&&kRoom===K.chats.indexOf(c))$('#kk').querySelectorAll('.kmt b').forEach(b=>b.remove())}
/* 답장 고르기: reply.rules 를 위에서부터 보고 처음 맞는 것 → 없으면 reply.else 를 차례로 */
function kReply(c,text){
  const R=c.reply||{};let say=null;
  for(const r of (R.rules||[]))if(new RegExp(r.k,'i').test(text)){say=r.say;break}
  if(!say){const e=R.else||[];if(!e.length)return;c._i=c._i||0;say=[e[c._i%e.length]];c._i++}
  const rd=K.readDelay==null?2000:K.readDelay,g=K.gap||2000;   // 시간 설정은 CFG.kakao 의 readDelay / delay / gap
  setTimeout(()=>kRead(c),rd);                                  // 보낸 말의 '1' 사라짐
  let d=K.delay||4000;                                          // 첫 답장
  say.forEach(line=>{setTimeout(()=>{kRead(c);kPush(c,'them',line)},d);d+=g})}
function kSend(){const i=$('#kinput');if(!i||kRoom==null)return;const t=i.value.trim();if(!t)return;
  const c=K.chats[kRoom];i.value='';$('#ksend').classList.remove('on');kPush(c,'me',t);kReply(c,t)}

/* 좋아요: 하트 버튼 / 사진 두 번 탭. 화면 위치는 그대로 두고 그 게시물만 바꿔요 */
function igLike(p,force){p._l=force!=null?force:!igLiked(p);const i=IG.posts.indexOf(p);
  $('#ig').querySelectorAll('.igp').forEach(a=>{if(+a.dataset.pid!==i)return;
    a.querySelector('.iglk').classList.toggle('on',igLiked(p));a.querySelector('.iglc').textContent=`좋아요 ${igCnt(p)}개`})}
function igTap(el){const t=Date.now();
  if(igLastEl===el&&t-igLast<320){igLike(IG.posts[+el.dataset.pid],true);
    const h=document.createElement('span');h.className='ig-hp';h.innerHTML='<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 20.8S3.2 15 3.2 8.9C3.2 6 5.4 4 8 4c1.7 0 3.2.9 4 2.3C12.8 4.9 14.3 4 16 4c2.6 0 4.8 2 4.8 4.9 0 6.1-8.8 11.9-8.8 11.9z"/></svg>';
    el.appendChild(h);setTimeout(()=>h.remove(),900);igLast=0}
  else{igLast=t;igLastEl=el}}
$('#ig').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;const g=b.dataset.g,sc=()=>{const x=$('#ig').querySelector('.ig-sc');return x?x.scrollTop:0};
  if(g==='like')igLike(IG.posts[+b.dataset.pid]);
  else if(g==='img')igTap(b);
  else if(g==='save'){const p=IG.posts[+b.dataset.pid];p._s=!p._s;b.classList.toggle('on',p._s)}
  else if(g==='user'){const u=b.dataset.u;
    if(u===IG.me.id){igSv[igH.length]=sc();igBase='me';igH=[];igRender()}
    else if(IG.users[u]){igSv[igH.length]=sc();igH.push({t:'user',u});igRender()}}
  else if(g==='open'){igSv[igH.length]=sc();igH.push({t:'post',pid:+b.dataset.pid});igRender()}
  else if(g==='back'){igH.pop();igRender.back=true;igRender()}
  else if(g==='tab'){igBase=b.dataset.t;igH=[];igRender()}
  else if(g==='fol'){const u=IG.users[b.dataset.u];
    if(igFol(u)){igSheet=b.dataset.u}else{u._f=true;clearTimeout(u._tm)}      // 다시 팔로우하면 예정된 전화는 취소
    igRender()}
  else if(g==='shx'){igSheet=null;igRender()}
  else if(g==='unf'){const u=IG.users[b.dataset.u];u._f=false;igSheet=null;igRender();     // 팔로우 취소 → 잠시 뒤 그 사람에게서 전화
    if(u.call&&!u._called){clearTimeout(u._tm);u._tm=setTimeout(()=>{if(u._f===false&&!u._called){u._called=1;tlDeliver({type:'call',from:u.call.from,lines:u.call.lines,ring:u.call.ring})}},(u.call.delay==null?10:u.call.delay)*1000)}}
  else if(g==='dmo'){const d=IG.dms[+b.dataset.i];d.unread=0;igSv[igH.length]=sc();igH.push({t:'dmc',d});igRender()}
  else if(g==='dmu'){let d=IG.dms.find(x=>x.u===b.dataset.u);if(!d){d={u:b.dataset.u,t:'',msgs:[]};IG.dms.unshift(d)}d.unread=0;igSv[igH.length]=sc();igH.push({t:'dmc',d});igRender()}
  else if(g==='dms')igDmSend()
  else if(g==='x')toast('아직 준비 중이에요')});
/* ===== 메모 (아이폰 메모 앱) ===== */
const NC=CFG.notes;let nView='fold',nFolder=null,nNote=null;
const nSvg=(d,x='')=>`<svg viewBox="0 0 24 24" ${x}>${d}</svg>`;
const NI={folder:'<svg class="fi" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#f5b800"/></svg>',
 trash:'<svg class="fi" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',
 chev:'<svg class="ch" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
 back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 comp:'<svg viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5"/><path d="M18.5 3.5a2 2 0 0 1 3 3L12 16l-4 1 1-4z"/></svg>',
 share:'<svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M6 10H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-1"/></svg>',
 more:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="12" r=".8" fill="#d9a100"/><circle cx="12" cy="12" r=".8" fill="#d9a100"/><circle cx="16" cy="12" r=".8" fill="#d9a100"/></svg>',
 search:'<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>',
 mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
 pin:'<svg viewBox="0 0 24 24"><path d="M14 3l7 7-3 1-3.5 3.5.5 4-2 2-4-4-5 5-1-1 5-5-4-4 2-2 4 .5L13 6z"/></svg>',
 list:'<svg viewBox="0 0 24 24"><circle cx="5" cy="7" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="5" cy="17" r="1.6"/><path d="M10 7h10M10 12h10M10 17h10"/></svg>',
 table:'<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 10h17M3.5 15h17M9.5 4.5v15M15 4.5v15"/></svg>',
 cam:'<svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2.5L9 4h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.8"/></svg>',
 pen:'<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/></svg>'};
const nYMD=d=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d).map(x=>[x.type,x.value]));return [+p.year,+p.month,+p.day]};
const nDate=t=>new Date(t.d.replace(' ','T')+':00+09:00');
const nTime=t=>nDate(t).toLocaleTimeString('ko-KR',{...TZ,hour:'numeric',minute:'2-digit',hour12:true});
const nAgo=t=>{const a=nYMD(now()),b=nYMD(nDate(t));return Math.round((Date.UTC(a[0],a[1]-1,a[2])-Date.UTC(b[0],b[1]-1,b[2]))/864e5)};
const nLabel=t=>{const g=nAgo(t);if(g<=0)return nTime(t);if(g===1)return '어제';if(g<=7)return nDate(t).toLocaleDateString('ko-KR',{...TZ,weekday:'long'});const [y,m,d]=nYMD(nDate(t));return `${y}. ${m}. ${d}.`};
const nGroup=t=>{const g=nAgo(t);if(g<=0)return '오늘';if(g===1)return '어제';if(g<=7)return '지난 7일';if(g<=30)return '지난 30일';const [y,m]=nYMD(nDate(t)),[cy]=nYMD(now());return y===cy?`${m}월`:`${y}년`};
const nTitle=t=>t.text.split('\n')[0]||'새로운 메모';
const nPrev=t=>t.text.split('\n').slice(1).filter(l=>l.trim()).map(l=>l.replace(/^\[( |x)\]\s*/i,'').replace(/^-\s+/,'')).join(' ')||'추가 텍스트 없음';
function nRender(){
  const el=$('#nt');el.classList.toggle('nv',nView==='note');
  const cnt=f=>f==='*'?NC.items.length:NC.items.filter(t=>t.f===f).length;
  const srch=`<div class="ntsr">${NI.search}<span>검색</span>${NI.mic}</div>`;
  if(nView==='fold'){
    const rows=[...(NC.folders.length>1?[['*','모든 iCloud']]:[]),...NC.folders.map(f=>[f,f])];
    el.innerHTML=`<div class="nttop"><span></span><button class="ntp" data-n="x">편집</button></div><div class="nts"><h1>폴더</h1>${srch}<div class="ntsec">iCloud</div><div class="ntcard">${rows.map(([f,nm])=>`<button class="ntfr" data-n="folder" data-f="${kesc(f)}">${NI.folder}<b>${kesc(nm)}</b><span>${cnt(f)}</span>${NI.chev}</button>`).join('')}<button class="ntfr" data-n="x">${NI.trash}<b>최근 삭제된 항목</b><span>0</span>${NI.chev}</button></div></div><div class="ntbot"><button class="ntbar" data-n="x">${nSvg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v5M9.5 12.5h5"/>')}새로운 폴더</button><button class="ntcmp" data-n="x" aria-label="새 메모">${NI.comp}</button></div>`;return}
  if(nView==='list'){
    const items=NC.items.map((t,i)=>[t,i]).filter(([t])=>nFolder==='*'||t.f===nFolder).sort((a,b)=>nDate(b[0])-nDate(a[0]));
    const groups=[],pins=items.filter(([t])=>t.pin);if(pins.length)groups.push(['고정됨',pins,1]);
    items.filter(([t])=>!t.pin).forEach(x=>{const g=nGroup(x[0]),l=groups[groups.length-1];if(l&&l[0]===g&&!l[2])l[1].push(x);else groups.push([g,[x]])});
    el.innerHTML=`<div class="nttop"><button class="ntp y" data-n="back">${NI.back}폴더</button><button class="ntp" data-n="x" style="padding:0" aria-label="더 보기">${NI.more.replace('stroke','stroke')}</button></div><div class="nts"><h1>${kesc(nFolder==='*'?'모든 iCloud':nFolder)}</h1>${srch}${groups.map(([g,list,pn])=>`<div class="ntsec">${pn?NI.pin:''}${kesc(g)}</div><div class="ntcard">${list.map(([t,i])=>`<button class="ntnr" data-n="note" data-i="${i}"><div class="t">${kesc(nTitle(t))}</div><div class="s"><b>${kesc(nLabel(t))}</b>${kesc(nPrev(t))}</div></button>`).join('')}</div>`).join('')}</div><div class="ntbot"><span class="ntbar c">${items.length}개의 메모</span><button class="ntcmp" data-n="x" aria-label="새 메모">${NI.comp}</button></div>`;return}
  const t=nNote,lines=t.text.split('\n'),[y,m,d]=nYMD(nDate(t)),old=el.querySelector('.ntdoc'),st=old?old.scrollTop:0;
  const body=lines.slice(1).map((l,i)=>{const ck=l.match(/^\[( |x)\]\s?(.*)$/i);
    if(ck){const on=ck[1].toLowerCase()==='x';return `<button class="ntck${on?' on':''}" data-n="ck" data-l="${i+1}"><i>${on?'✓':''}</i><span>${kesc(ck[2])}</span></button>`}
    const bl=l.match(/^-\s+(.*)$/);if(bl)return `<div class="ntln">• ${kesc(bl[1])}</div>`;
    return `<div class="ntln">${l.trim()?kesc(l):'&nbsp;'}</div>`}).join('');
  el.innerHTML=`<div class="nttop"><button class="ntp y" data-n="back">${NI.back}${kesc(nFolder==='*'?'모든 iCloud':nFolder)}</button><span class="ntr"><button class="ntp" data-n="x" aria-label="공유">${NI.share}</button><button class="ntp" data-n="x" aria-label="더 보기">${NI.more}</button></span></div><div class="ntdoc"><div class="ntdt">${y}년 ${m}월 ${d}일 ${nTime(t)}</div><h2>${kesc(lines[0]||'새로운 메모')}</h2>${body}</div><div class="ntbot"><span class="ntbar g">${['list','table','cam','pen'].map(k=>`<button data-n="x" style="display:flex">${NI[k]}</button>`).join('')}</span><button class="ntcmp" data-n="x" aria-label="새 메모">${NI.comp}</button></div>`;
  const nd=el.querySelector('.ntdoc');if(nd)nd.scrollTop=st;
}
$('#nt').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;const a=b.dataset.n;
  if(a==='folder'){nFolder=b.dataset.f;nView='list';nRender()}
  else if(a==='note'){nNote=NC.items[+b.dataset.i];nView='note';nRender()}
  else if(a==='back'){nView=nView==='note'?'list':'fold';nRender()}
  else if(a==='ck'){const L=nNote.text.split('\n'),i=+b.dataset.l;L[i]=L[i].replace(/^\[( |x)\]/i,m=>m.toLowerCase()==='[x]'?'[ ]':'[x]');nNote.text=L.join('\n');nRender()}
  else if(a==='x')toast('아직 준비 중이에요')});
document.addEventListener('keydown',e=>{
  const c=phone.classList;
  if(c.contains('app')){
    if(pvIdx!=null){if(e.key==='Escape')pClose();else if(e.key==='ArrowLeft')pStep(-1);else if(e.key==='ArrowRight')pStep(1);return}
    if(e.key==='Escape'){if(kRoom!=null){kRoom=null;kRender()}else if(pAlbum!=null){pAlbum=null;pRender()}else closeApp()}return}
  if(!c.contains('pass')&&!c.contains('home')&&(e.key==='Enter'||e.key===' '||/^\d$/.test(e.key))){openPass();if(/^\d$/.test(e.key))press(e.key);return}
  if(!c.contains('pass'))return;
  if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')setPin(pin.slice(0,-1));else if(e.key==='Escape')closePass()});

/* ===== 이름 입력 / {이름} 바꾸기 ===== */
const jong=n=>{const c=String(n||'').trim().slice(-1).charCodeAt(0)-0xAC00;return c>=0&&c<11172?c%28:0};      // 받침 (0 = 받침 없음 / 한글 아님)
const NJ={'':[0,0],'아':['아','야'],'이':['이','가'],'은':['은','는'],'을':['을','를'],'과':['과','와'],'이랑':['이랑','랑']};
let VNAME=CFG.defaultName||'';
const fillName=t=>String(t).replace(/\{이름(아|이|은|을|과|이랑)?\}/g,(m,j)=>j?VNAME+NJ[j][jong(VNAME)>0?0:1]:VNAME);
function personalize(o){
  if(typeof o==='string')return fillName(o);
  if(Array.isArray(o)){for(let i=0;i<o.length;i++)o[i]=personalize(o[i]);return o}
  if(o&&typeof o==='object'){for(const k in o)o[k]=personalize(o[k]);return o}
  return o}
function applyName(n){
  VNAME=(String(n||'').trim().slice(0,12))||CFG.defaultName||'나';
  personalize(CFG);personalize(TR);                       // 설정과 최근 통화 목록 안의 {이름} 을 모두 바꿈
  document.title=fillName(CFG.title||'iPhone');
  try{sessionStorage.setItem('phone-name',VNAME)}catch(e){}
  $('#who').classList.remove('on')}
(function(){
  let q=null,sv=null;
  try{q=new URLSearchParams(location.search).get('name')}catch(e){}
  try{sv=sessionStorage.getItem('phone-name')}catch(e){}
  if(!CFG.askName){applyName(CFG.defaultName);return}
  if(q&&q.trim()){applyName(q);return}
  if(sv){applyName(sv);return}
  const w=$('#who');
  w.innerHTML=`<h2>${kesc(CFG.askTitle||'이름을 알려 주세요')}</h2><p>${kesc(CFG.askHint||'')}</p><input id="whoin" maxlength="12" placeholder="이름" autocomplete="off" enterkeyhint="go" aria-label="이름"><button id="whogo">시작하기</button>`;
  w.classList.add('on');
  const go=()=>applyName($('#whoin').value);
  $('#whogo').addEventListener('click',go);
  $('#whoin').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();go()}});
  setTimeout(()=>{try{$('#whoin').focus()}catch(e){}},300)})();
</script>
